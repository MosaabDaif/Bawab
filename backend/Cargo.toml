[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
axum            = "0.7"
sqlx            = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
tokio           = { version = "1",   features = ["full"] }
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"
bcrypt          = "0.15"
jsonwebtoken    = "9"
tower-http      = { version = "0.5", features = ["cors"] }
chrono          = "0.4"
dotenv          = "0.15"
